services:
  - type: web
    name: gtm-guru-lark-bridge
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: LARK_APP_ID
        value: cli_aa0509c988f85cfd
      - key: LARK_APP_SECRET
        sync: false
      - key: LARK_VERIFICATION_TOKEN
        sync: false
      - key: AIME_USER_OPEN_ID
        value: ou_82ca1e7acc83296b84930b6dd39951da
      - key: BUYER_GTM_GROUP_ID
        value: oc_8a963e87591fe5023b7da9a7bfa5c9ee
      - key: BRIDGE_SECRET_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
